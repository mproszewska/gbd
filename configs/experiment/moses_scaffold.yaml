# @package _global_
general:
    name : 'moses_scaffold'
    gpus : 1
    wandb: 'disabled'
    remove_h: True
    resume: null
    test_only: null
    check_val_every_n_epochs: 1
    val_check_interval: null
    sample_every_val: 1
    samples_to_generate: 256
    samples_to_save: 20
    chains_to_save: 5
    log_every_steps: 50

    final_model_samples_to_generate: 25000
    final_model_samples_to_save: 50
    final_model_chains_to_save: 20

train:
    optimizer: adamw
    n_epochs: 300
    batch_size: 64
    save_model: True
    lr: 2e-4
    num_workers: 4
    time_distortion: 'polydec'
    mask_output: False

sample:
    time_distortion: 'polydec'
    omega: 0.5
    eta: 200
    eval_molgenbench: False

model:
    n_layers: 12
    type: 'discrete'
    transition: 'absorbing'                          # uniform or marginal
    model: 'graph_tf'

    # Do not set hidden_mlp_E, dim_ffE too high, computing large tensors on the edges is costly
    # At the moment (03/08), y contains quite little information
    hidden_mlp_dims: { 'X': 256, 'E': 128, 'y': 256}
    rrwp_steps: 20

    # The dimensions should satisfy dx % n_head == 0
    hidden_dims: { 'dx': 256, 'de': 64, 'dy': 128, 'n_head': 8, 'dim_ffX': 256, 'dim_ffE': 128, 'dim_ffy': 256}
    add_is_scaffold: False
    keep_scaffold_fixed: False
    ignore_y: True
    no_extra_feat: False
    skip_scaffold_prob: 1.0 # negative = never true
    sample_fragments_prob: 0.
    label_dims: 2

dataset:
    pin_memory: True
    num_workers: 16



